{% comment %}Keep-screen-awake toggle: recipe pages only, i.e. pages with a parent category.{% endcomment %}
{% if page.parent %}
<script src="/assets/js/wake-lock.js" defer></script>
<style>
.wake-lock-toggle {
  position: fixed;
  right: calc(1rem + env(safe-area-inset-right));
  bottom: calc(1rem + env(safe-area-inset-bottom));
  z-index: 10;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
}
.wake-lock-toggle-label {
  margin-left: 0.25em;
}
@media (max-width: 49.99rem) {
  .btn.wake-lock-toggle,
  .btn.wake-lock-toggle:hover,
  .btn.wake-lock-toggle:focus,
  .btn.wake-lock-toggle:active {
    width: 2.75rem;
    height: 2.75rem;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: #7253ed;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
    font-size: 1.5rem;
    line-height: 1;
  }
  .btn.wake-lock-toggle[aria-pressed="true"] {
    background: #5e41d0;
  }
  .btn.wake-lock-toggle:focus-visible {
    outline: 2px solid currentColor;
    outline-offset: 2px;
  }
  .wake-lock-toggle-label {
    display: none;
  }
}
</style>
{% endif %}
